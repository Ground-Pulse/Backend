# Render Blueprint — creates the whole backend stack in one go:
#   Postgres (database) + Key Value/Redis (BullMQ queues) + the NestJS API.
# Render dashboard → New → Blueprint → pick this repo.
#
# After the frontend is on Vercel, set ALLOWED_ORIGINS and APP_URL on the
# groundpulse-api service to the Vercel URL (Environment tab).

databases:
  - name: groundpulse-db
    plan: free
    region: singapore
    databaseName: groundpulse
    user: groundpulse

services:
  - type: keyvalue
    name: groundpulse-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction # BullMQ must never lose jobs
    ipAllowList: [] # internal connections only

  - type: web
    name: groundpulse-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:render
    # applies pending migrations and seeds demo data only if the DB is empty
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: groundpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: groundpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: SEED_ONLY_IF_EMPTY
        value: "true"
      # Your Vercel URL(s), comma-separated. Wildcards allowed for previews.
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: APP_URL
        sync: false
      # Free instances have no persistent disk: local uploads are lost on
      # redeploy. Switch to MEDIA_DRIVER=s3 + AWS_* / S3_BUCKET for real use.
      - key: MEDIA_DRIVER
        value: local
      - key: RATE_LIMIT_PER_MINUTE
        value: "600"
