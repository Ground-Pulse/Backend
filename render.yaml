# Render Blueprint — creates the whole backend stack in one go:
#   Postgres (database) + Key Value/Redis (BullMQ queues) + the NestJS API.
# Render dashboard → New → Blueprint → pick this repo.
#
# Frontend: https://groundpulse-web.vercel.app (Vercel project groundpulse-web)

databases:
  - name: groundpulse-db
    plan: free
    region: singapore
    databaseName: groundpulse
    user: groundpulse

services:
  - type: keyvalue
    name: groundpulse-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction # BullMQ must never lose jobs
    ipAllowList: [] # internal connections only

  - type: web
    name: groundpulse-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:render
    # applies pending migrations and seeds demo data only if the DB is empty
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: groundpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: groundpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 15m
      - key: REFRESH_TOKEN_EXPIRATION
        value: 7d
      - key: SEED_ONLY_IF_EMPTY
        value: "true"
      # Frontend URL(s), comma-separated. One-label wildcards allowed (previews).
      - key: ALLOWED_ORIGINS
        value: https://groundpulse-web.vercel.app,https://groundpulse-*-vikash7485s-projects.vercel.app
      - key: APP_URL
        value: https://groundpulse-web.vercel.app
      # Free instances have no persistent disk: local uploads are lost on
      # redeploy. Switch to MEDIA_DRIVER=s3 + AWS_* / S3_BUCKET for real use.
      - key: MEDIA_DRIVER
        value: local
      - key: RATE_LIMIT_PER_MINUTE
        value: "600"
      # Email via Resend SMTP (free: 3,000/month). Without a verified domain,
      # Resend only delivers to the Resend account owner's own address.
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS # Resend API key (re_...), set in the dashboard
        sync: false
      - key: EMAIL_FROM
        value: GroundPulse <onboarding@resend.dev>
